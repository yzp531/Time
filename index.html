<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121212" id="metaTheme">

<meta name="mobile-web-app-capable" content="yes">

<title>翻页时钟 · time.i-xx.top</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
<style>
  /* ===================== 主题变量 ===================== */
  :root {
    --bg: #121212;
    --card-top: linear-gradient(180deg, #2C2C2F 0%, #232326 100%);
    --card-bot: linear-gradient(180deg, #1D1D20 0%, #161618 100%);
    --text: #F0F0F0;
    --muted: rgba(240, 240, 240, .45);
    --fold: rgba(0, 0, 0, .85);
    --panel-bg: rgba(255, 255, 255, .07);
    --panel-border: rgba(255, 255, 255, .13);
    --btn-bg: rgba(255, 255, 255, .08);
    --btn-hover: rgba(255, 255, 255, .18);
    --btn-on: rgba(255, 255, 255, .3);
    --shadow: 0 28px 58px rgba(0, 0, 0, .65);
    --radius: 18px;
  }

  :root[data-theme="bauhaus"] {
    --bg: #F1F1F3;
    --card-top: linear-gradient(180deg, #FFFFFF 0%, #F7F7F9 100%);
    --card-bot: linear-gradient(180deg, #E7E7EB 0%, #DEDEE3 100%);
    --text: #17191C;
    --muted: rgba(23, 25, 28, .42);
    --fold: rgba(0, 0, 0, .26);
    --panel-bg: rgba(255, 255, 255, .65);
    --panel-border: rgba(0, 0, 0, .08);
    --btn-bg: rgba(0, 0, 0, .05);
    --btn-hover: rgba(0, 0, 0, .1);
    --btn-on: rgba(0, 0, 0, .18);
    --shadow: 0 24px 48px rgba(20, 22, 26, .25);
  }

  :root[data-theme="retro"] {
    --bg: radial-gradient(120% 120% at 18% 0%, #1C3B31 0%, #0F211B 58%, #0A1713 100%);
    --card-top: linear-gradient(180deg, #274A3E 0%, #1F3A31 100%);
    --card-bot: linear-gradient(180deg, #183029 0%, #12241E 100%);
    --text: #F1E7D3;
    --muted: rgba(241, 231, 211, .5);
    --fold: rgba(0, 0, 0, .7);
    --panel-bg: rgba(241, 231, 211, .08);
    --panel-border: rgba(241, 231, 211, .16);
    --btn-bg: rgba(241, 231, 211, .08);
    --btn-hover: rgba(241, 231, 211, .18);
    --btn-on: rgba(241, 231, 211, .28);
    --shadow: 0 28px 58px rgba(0, 0, 0, .6);
  }

  /* ---- 深海蓝 ---- */
  :root[data-theme="ocean"] {
    --bg: linear-gradient(160deg, #0D2A4A 0%, #0A1E35 60%, #071422 100%);
    --card-top: linear-gradient(180deg, #1E4A6B 0%, #16324D 100%);
    --card-bot: linear-gradient(180deg, #123048 0%, #0C2033 100%);
    --text: #E8F4FD;
    --muted: rgba(232, 244, 253, .45);
    --fold: rgba(0, 0, 0, .7);
    --panel-bg: rgba(232, 244, 253, .07);
    --panel-border: rgba(232, 244, 253, .13);
    --btn-bg: rgba(232, 244, 253, .08);
    --btn-hover: rgba(232, 244, 253, .18);
    --btn-on: rgba(232, 244, 253, .28);
    --shadow: 0 28px 58px rgba(0, 0, 0, .6);
  }

  /* ---- 日落暖橙 ---- */
  :root[data-theme="sunset"] {
    --bg: linear-gradient(160deg, #3D2B1F 0%, #2A1C14 50%, #1A1009 100%);
    --card-top: linear-gradient(180deg, #6B4226 0%, #4A2C1A 100%);
    --card-bot: linear-gradient(180deg, #3D2418 0%, #2A1810 100%);
    --text: #FFF3E8;
    --muted: rgba(255, 243, 232, .45);
    --fold: rgba(0, 0, 0, .65);
    --panel-bg: rgba(255, 243, 232, .07);
    --panel-border: rgba(255, 243, 232, .13);
    --btn-bg: rgba(255, 243, 232, .08);
    --btn-hover: rgba(255, 243, 232, .18);
    --btn-on: rgba(255, 243, 232, .28);
    --shadow: 0 28px 58px rgba(0, 0, 0, .55);
  }

  /* ---- 森林绿 ---- */
  :root[data-theme="forest"] {
    --bg: linear-gradient(160deg, #1B2E1B 0%, #111E12 50%, #0A140A 100%);
    --card-top: linear-gradient(180deg, #2D4A2A 0%, #1E3320 100%);
    --card-bot: linear-gradient(180deg, #1A2A18 0%, #101A10 100%);
    --text: #E8F5E9;
    --muted: rgba(232, 245, 233, .45);
    --fold: rgba(0, 0, 0, .7);
    --panel-bg: rgba(232, 245, 233, .07);
    --panel-border: rgba(232, 245, 233, .13);
    --btn-bg: rgba(232, 245, 233, .08);
    --btn-hover: rgba(232, 245, 233, .18);
    --btn-on: rgba(232, 245, 233, .28);
    --shadow: 0 28px 58px rgba(0, 0, 0, .6);
  }

  /* ---- 奶油暖白 ---- */
  :root[data-theme="cream"] {
    --bg: linear-gradient(160deg, #F5F0E8 0%, #EDE6DA 50%, #E3DACA 100%);
    --card-top: linear-gradient(180deg, #FFFFFF 0%, #F5F0E6 100%);
    --card-bot: linear-gradient(180deg, #EDE6DA 0%, #E0D8C8 100%);
    --text: #2A2418;
    --muted: rgba(42, 36, 24, .4);
    --fold: rgba(42, 36, 24, .2);
    --panel-bg: rgba(42, 36, 24, .06);
    --panel-border: rgba(42, 36, 24, .1);
    --btn-bg: rgba(42, 36, 24, .06);
    --btn-hover: rgba(42, 36, 24, .12);
    --btn-on: rgba(42, 36, 24, .18);
    --shadow: 0 24px 48px rgba(42, 36, 24, .22);
  }

  /* ---- 午夜蓝 ---- */
  :root[data-theme="midnight"] {
    --bg: linear-gradient(160deg, #1A1A2E 0%, #12121E 50%, #0A0A14 100%);
    --card-top: linear-gradient(180deg, #2A2A4A 0%, #1E1E33 100%);
    --card-bot: linear-gradient(180deg, #1A1A2E 0%, #12121A 100%);
    --text: #E8E8F8;
    --muted: rgba(232, 232, 248, .4);
    --fold: rgba(0, 0, 0, .75);
    --panel-bg: rgba(232, 232, 248, .07);
    --panel-border: rgba(232, 232, 248, .13);
    --btn-bg: rgba(232, 232, 248, .08);
    --btn-hover: rgba(232, 232, 248, .18);
    --btn-on: rgba(232, 232, 248, .28);
    --shadow: 0 28px 58px rgba(0, 0, 0, .6);
  }

  /* ---- 薰衣草 ---- */
  :root[data-theme="lavender"] {
    --bg: linear-gradient(160deg, #2D1B3D 0%, #1E1230 50%, #140A20 100%);
    --card-top: linear-gradient(180deg, #4A2E5E 0%, #352042 100%);
    --card-bot: linear-gradient(180deg, #2D1B3D 0%, #1E1230 100%);
    --text: #F0E8F8;
    --muted: rgba(240, 232, 248, .45);
    --fold: rgba(0, 0, 0, .7);
    --panel-bg: rgba(240, 232, 248, .07);
    --panel-border: rgba(240, 232, 248, .13);
    --btn-bg: rgba(240, 232, 248, .08);
    --btn-hover: rgba(240, 232, 248, .18);
    --btn-on: rgba(240, 232, 248, .28);
    --shadow: 0 28px 58px rgba(0, 0, 0, .6);
  }

  /* ---- 石板灰 ---- */
  :root[data-theme="slate"] {
    --bg: linear-gradient(160deg, #2A2A2E 0%, #1E1E22 50%, #141418 100%);
    --card-top: linear-gradient(180deg, #3A3A42 0%, #2A2A30 100%);
    --card-bot: linear-gradient(180deg, #2A2A2E 0%, #1E1E22 100%);
    --text: #E8E8EC;
    --muted: rgba(232, 232, 236, .4);
    --fold: rgba(0, 0, 0, .7);
    --panel-bg: rgba(232, 232, 236, .07);
    --panel-border: rgba(232, 232, 236, .13);
    --btn-bg: rgba(232, 232, 236, .08);
    --btn-hover: rgba(232, 232, 236, .18);
    --btn-on: rgba(232, 232, 236, .28);
    --shadow: 0 28px 58px rgba(0, 0, 0, .6);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    transition: background .6s ease, color .6s ease;
  }

  body.idle { cursor: none; }

  /* ===================== 时钟本体 ===================== */
  .clock {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(var(--fit, 1)) translateZ(0);
    transform-origin: center center;
    will-change: transform;
    backface-visibility: hidden;
  }

  .digits {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }

  .group { display: flex; gap: 12px; }

  /* 数字卡片 */
  .digit {
    position: relative;
    width: 144px;
    height: 228px;
    --fs: calc(228px * 1.08);
    backface-visibility: hidden;
  }

  .card {
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--card-bot);
    box-shadow:
      var(--shadow),
      0 2px 0 rgba(0, 0, 0, .25),
      inset 0 1px 0 rgba(255, 255, 255, .06),
      inset 0 -3px 8px rgba(0, 0, 0, .35);
    perspective: 1300px;
    perspective-origin: 50% 50%;
    transform-style: preserve-3d;
    backface-visibility: hidden;
  }

  /* 卡片立体厚度 —— 底部与侧边的 3D 投影，让卡片像实体一样有深度 */
  .card::after {
    content: '';
    position: absolute;
    left: 4px;
    right: 4px;
    bottom: -5px;
    height: 10px;
    background: linear-gradient(180deg, rgba(0, 0, 0, .15), rgba(0, 0, 0, .5));
    border-radius: 0 0 8px 8px;
    pointer-events: none;
    z-index: -1;
  }

  .half {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    overflow: hidden;
    backface-visibility: hidden;
    will-change: transform;
  }

  .half.top {
    top: 0;
    border-radius: var(--radius) var(--radius) 0 0;
    background: var(--card-top);
  }

  .half.bottom {
    bottom: 0;
    border-radius: 0 0 var(--radius) var(--radius);
    background: var(--card-bot);
  }

  /* 数字跨过折线：一半在上一半在下 */
  .half > span {
    position: absolute;
    left: 0;
    width: 100%;
    height: 200%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--fs);
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    letter-spacing: -.02em;
    color: var(--text);
    backface-visibility: hidden;
    transform: translateZ(0);
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    font-smoothing: antialiased;
    /* 等宽字体 + 微阴影，确保缩放后边缘锐利不发虚 */
    font-family: 'DejaVu Sans Mono', 'SF Mono', 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    text-shadow: 0 0 1px var(--text);
  }

  .half.top > span { top: 0; }
  .half.bottom > span { bottom: 0; }

  /* 层级：静态上 < 静态下 < 下落上页 < 落回下页 */
  .half.static.top    { z-index: 1; }
  .half.static.bottom { z-index: 2; }
  .flap-top    { z-index: 3; transform: rotateX(0deg); transform-origin: 50% 100%; }
  .flap-bottom { z-index: 4; transform: rotateX(90deg); transform-origin: 50% 0%; }

  /* 翻页动画：上半页下落（前半程）→ 下半页落回（后半程） */
  @keyframes flip-top {
    from { transform: rotateX(0deg); }
    to   { transform: rotateX(-90deg); }
  }
  @keyframes flip-bottom {
    from { transform: rotateX(90deg); }
    to   { transform: rotateX(0deg); }
  }
  @keyframes shade-in {
    from { opacity: 0; }
    to   { opacity: .45; }
  }
  @keyframes shade-out {
    from { opacity: .38; }
    to   { opacity: 0; }
  }

  .card.flipping .flap-top {
    animation: flip-top var(--half, 300ms) cubic-bezier(.36, 0, .66, .5) both;
  }
  .card.flipping .flap-top::after {
    content: '';
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    animation: shade-in var(--half, 300ms) ease-in both;
  }
  .card.flipping .flap-bottom {
    animation: flip-bottom var(--half, 300ms) cubic-bezier(.2, 1.4, .5, 1) both;
    animation-delay: var(--half, 300ms);
  }
  .card.flipping .flap-bottom::after {
    content: '';
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    animation: shade-out var(--half, 300ms) ease-out both;
    animation-delay: var(--half, 300ms);
  }

  /* 折线与折痕阴影 —— 加粗加深，强化立体折痕感 */
  .fold {
    position: absolute;
    left: 0;
    top: 50%;
    width: 100%;
    height: 4px;
    margin-top: -2px;
    background: var(--fold);
    z-index: 6;
    pointer-events: none;
    border-radius: 2px;
    box-shadow:
      0 -3px 6px rgba(0, 0, 0, .25),
      0 3px 6px rgba(0, 0, 0, .25);
  }
  .fold::before {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 100%;
    height: 30px;
    background: linear-gradient(0deg, rgba(0, 0, 0, .38), rgba(0, 0, 0, 0));
  }
  .fold::after {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 100%;
    height: 26px;
    background: linear-gradient(180deg, rgba(0, 0, 0, .30), rgba(0, 0, 0, 0));
  }

  /* 冒号 */
  .colon {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    width: 24px;
    height: 228px;
    color: var(--text);
    opacity: .8;
    font-family: 'DejaVu Sans Mono', 'SF Mono', 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    text-shadow: 0 0 1px currentColor;
  }
  .colon i {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: currentColor;
    animation: blink 2s ease-in-out infinite;
    box-shadow: 0 0 6px currentColor;
  }
  @keyframes blink {
    0%, 100% { opacity: .35; }
    50%      { opacity: 1; }
  }

  /* 日期 */
  .date {
    margin-top: 36px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .35em;
    text-indent: .35em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    text-shadow: 0 0 1px var(--muted);
  }
  .date .period { margin-left: .8em; letter-spacing: .2em; }
  body.no-date .date,
  body.no-seconds #g-s,
  body.no-seconds #colon-s { display: none; }

  /* ===================== 控制面板 ===================== */
  .hud {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 100vw;
    height: 100vh;
    transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
    transform-origin: center center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    padding: 20px;
    padding-bottom: 60px;
    pointer-events: none;
    z-index: 10;
  }

  @media (min-width: 768px) {
    .hud { padding-bottom: 120px; }
  }

  /* 横屏模式下交换宽高，旋转后正好覆盖整个视口，面板贴到画面底边 */
  body.is-rotated .hud {
    width: 100vh;
    height: 100vw;
  }

  .panel {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    max-width: 100%;
    padding: 8px 14px;
    border-radius: 26px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .35s ease, transform .35s ease;
    pointer-events: none;
  }

  body.ui-visible .panel {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .btn {
    appearance: none;
    border: 0;
    background: var(--btn-bg);
    color: var(--text);
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: .06em;
    padding: 8px 14px;
    border-radius: 18px;
    cursor: pointer;
    transition: background .25s ease, opacity .25s ease;
    white-space: nowrap;
  }
  .btn:hover { background: var(--btn-hover); }
  .btn.on { background: var(--btn-on); }

  .theme-set {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    padding: 4px 6px;
    justify-content: center;
    max-width: 100%;
  }
  .dot {
    appearance: none;
    border: 0;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    cursor: pointer;
    padding: 0;
    opacity: .35;
    transition: opacity .25s ease, transform .25s ease;
  }
  .dot[data-theme="dark"]    { background: #E8E8E8; }
  .dot[data-theme="bauhaus"] { background: #C9C9CF; }
  .dot[data-theme="retro"]   { background: #8AA79A; }
  .dot[data-theme="ocean"]   { background: #5B9BD5; }
  .dot[data-theme="sunset"]  { background: #E8A87C; }
  .dot[data-theme="forest"]  { background: #7DB87D; }
  .dot[data-theme="cream"]   { background: #D4C8B0; }
  .dot[data-theme="midnight"] { background: #8888AA; }
  .dot[data-theme="lavender"] { background: #B89BC8; }
  .dot[data-theme="slate"]   { background: #88888E; }
  .dot.on { opacity: 1; transform: scale(1.22); }
  .vline { width: 1px; height: 18px; background: var(--panel-border); }

  .hint {
    font-size: 10.5px;
    letter-spacing: .12em;
    color: var(--muted);
    opacity: 0;
    transition: opacity .35s ease;
    pointer-events: none;
  }
  body.ui-visible .hint { opacity: .55; }
</style>
</head>
<body>
  <div class="clock" id="clock">
    <div class="digits">
      <div class="group" id="g-h"></div>
      <div class="colon"><i></i><i></i></div>
      <div class="group" id="g-m"></div>
      <div class="colon" id="colon-s"><i></i><i></i></div>
      <div class="group" id="g-s"></div>
    </div>
    <div class="date">
      <span id="d-week"></span>, <span id="d-month"></span> <span id="d-day"></span>
      <span class="period" id="d-period"></span>
    </div>
  </div>

  <div class="hud">
    <div class="panel" id="panel">
      <div class="theme-set">
        <button class="dot" data-theme="dark" title="暗黑纯粹" aria-label="暗黑纯粹"></button>
        <button class="dot" data-theme="bauhaus" title="极简包豪斯" aria-label="极简包豪斯"></button>
        <button class="dot" data-theme="retro" title="复古摩登" aria-label="复古摩登"></button>
        <button class="dot" data-theme="ocean" title="深海蓝" aria-label="深海蓝"></button>
        <button class="dot" data-theme="sunset" title="日落暖橙" aria-label="日落暖橙"></button>
        <button class="dot" data-theme="forest" title="森林绿" aria-label="森林绿"></button>
        <button class="dot" data-theme="cream" title="奶油暖白" aria-label="奶油暖白"></button>
        <button class="dot" data-theme="midnight" title="午夜蓝" aria-label="午夜蓝"></button>
        <button class="dot" data-theme="lavender" title="薰衣草" aria-label="薰衣草"></button>
        <button class="dot" data-theme="slate" title="石板灰" aria-label="石板灰"></button>
      </div>
      <span class="vline"></span>
      <button class="btn" id="btn-seconds">秒</button>
      <button class="btn" id="btn-hour">24H</button>
      <button class="btn" id="btn-sound">音效</button>
      <button class="btn" id="btn-date">日期</button>
      <button class="btn" id="btn-land">横屏·自动</button>
      <button class="btn" id="btn-flip" title="切换横屏方向">⇄</button>
      <button class="btn" id="btn-full">全屏</button>
    </div>
    <div class="hint">双击屏幕全屏 · 手机横放显示更佳</div>
  </div>

  <noscript><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center">本页需要启用 JavaScript</div></noscript>

<script>
(function () {
  'use strict';

  /* ===================== 偏好设置 ===================== */
  var PREF_KEY = 'flipclock.prefs.v1';
  var prefs = { theme: 'dark', seconds: true, h24: true, sound: true, date: true, landscape: 'auto', flip: -1 };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch (e) {}
  function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {} }

  var THEME_COLOR = { dark: '#121212', bauhaus: '#F1F1F3', retro: '#0F211B', ocean: '#0D2A4A', sunset: '#3D2B1F', forest: '#1B2E1B', cream: '#F5F0E8', midnight: '#1A1A2E', lavender: '#2D1B3D', slate: '#2A2A2E' };
  var FLIP_MS = 620;                 // 一次翻页总时长
  var root = document.documentElement;

  root.style.setProperty('--half', (FLIP_MS / 2) + 'ms');

  var clock = document.getElementById('clock');
  var metaTheme = document.getElementById('metaTheme');
  var btnSeconds = document.getElementById('btn-seconds');
  var btnHour = document.getElementById('btn-hour');
  var btnSound = document.getElementById('btn-sound');
  var btnDate = document.getElementById('btn-date');
  var btnLand = document.getElementById('btn-land');
  var btnFlip = document.getElementById('btn-flip');
  var btnFull = document.getElementById('btn-full');

  /* ===================== 音效（WebAudio 合成，无外部资源） ===================== */
  var Sound = (function () {
    var ctx = null, noise = null;

    function ensure() {
      if (ctx) return ctx;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      var len = Math.floor(ctx.sampleRate * 0.06);
      noise = ctx.createBuffer(1, len, ctx.sampleRate);
      var data = noise.getChannelData(0);
      for (var i = 0; i < len; i++) {
        var decay = 1 - i / len;
        data[i] = (Math.random() * 2 - 1) * decay * decay;
      }
      return ctx;
    }

    function unlock() {
      var c = ensure();
      if (c && c.state === 'suspended') c.resume();
    }

    function click() {
      var c = ensure();
      if (!c) return;
      if (c.state === 'suspended') c.resume();
      var t = c.currentTime;

      // 清脆“咔哒”
      var src = c.createBufferSource();
      src.buffer = noise;
      var bp = c.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 1800 + Math.random() * 900;
      bp.Q.value = 6;
      var g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.42, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      src.connect(bp); bp.connect(g); g.connect(c.destination);
      src.start(t); src.stop(t + 0.12);

      // 纸卡落下的低闷声
      var osc = c.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(170, t);
      osc.frequency.exponentialRampToValueAtTime(85, t + 0.08);
      var og = c.createGain();
      og.gain.setValueAtTime(0.0001, t);
      og.gain.exponentialRampToValueAtTime(0.14, t + 0.006);
      og.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      osc.connect(og); og.connect(c.destination);
      osc.start(t); osc.stop(t + 0.14);
    }

    return { unlock: unlock, click: click };
  })();

  /* ===================== 单个数字（翻页卡片） ===================== */
  var DIGIT_HTML =
    '<div class="card">' +
      '<div class="half top static"><span>0</span></div>' +
      '<div class="half bottom static"><span>0</span></div>' +
      '<div class="half top flap flap-top"><span>0</span></div>' +
      '<div class="half bottom flap flap-bottom"><span>0</span></div>' +
      '<div class="fold"></div>' +
    '</div>';

  function Digit(el) {
    this.el = el;
    this.card = el.querySelector('.card');
    this.staticTop = el.querySelector('.static.top span');
    this.staticBottom = el.querySelector('.static.bottom span');
    this.flapTop = el.querySelector('.flap-top span');
    this.flapBottom = el.querySelector('.flap-bottom span');
    this.value = null;
    this.timer = null;
    this.token = 0;

    var self = this;
    this.card.addEventListener('animationend', function (e) {
      if (e.animationName === 'flip-bottom') self.finish();
    });
  }

  // 静止态：四层同值，视觉与翻页结束帧完全一致
  Digit.prototype.render = function (v) {
    this.staticTop.textContent = v;
    this.staticBottom.textContent = v;
    this.flapTop.textContent = v;
    this.flapBottom.textContent = v;
    this.card.classList.remove('flipping');
  };

  Digit.prototype.finish = function () {
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
    if (!this.card.classList.contains('flipping')) return;
    this.render(this.value);
  };

  Digit.prototype.set = function (v, animate) {
    v = String(v);
    if (v === this.value) return;

    var from = this.value;
    this.value = v;

    if (!animate || from === null) { this.render(v); return; }

    // 起始帧：上页 = 旧值，静态上半 = 新值，静态下半 = 旧值，落回页 = 新值
    this.staticTop.textContent = v;
    this.staticBottom.textContent = from;
    this.flapTop.textContent = from;
    this.flapBottom.textContent = v;

    this.card.classList.remove('flipping');
    void this.card.offsetWidth;            // 强制重排，重启动画
    this.card.classList.add('flipping');

    var self = this;
    var token = ++this.token;
    if (this.timer) clearTimeout(this.timer);
    this.timer = setTimeout(function () {    // 后台标签页不派发 animationend，兜底收尾
      if (token === self.token) self.finish();
    }, FLIP_MS + 120);
  };

  /* ===================== 时钟 ===================== */
  function makeDigit(group) {
    var d = document.createElement('div');
    d.className = 'digit';
    d.innerHTML = DIGIT_HTML;
    group.appendChild(d);
    return new Digit(d);
  }

  var digits = {
    h: [makeDigit(document.getElementById('g-h')), makeDigit(document.getElementById('g-h'))],
    m: [makeDigit(document.getElementById('g-m')), makeDigit(document.getElementById('g-m'))],
    s: [makeDigit(document.getElementById('g-s')), makeDigit(document.getElementById('g-s'))]
  };

  var WEEK = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  var MONTH = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  var lastTick = 0;
  var lastKey = null;

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function timeKey(d) {
    var h = d.getHours();
    if (!prefs.h24) h = h % 12 || 12;
    return pad(h) + pad(d.getMinutes()) + pad(d.getSeconds());
  }

  function applyKey(key, animate) {
    var map = [['h', 0], ['h', 1], ['m', 0], ['m', 1], ['s', 0], ['s', 1]];
    for (var i = 0; i < map.length; i++) {
      var digit = digits[map[i][0]][map[i][1]];
      // 秒位在隐藏时直接改写，不做无意义的翻页
      digit.set(key.charAt(i), animate && (i < 4 || prefs.seconds));
    }
  }

  function updateDate(d) {
    document.getElementById('d-week').textContent = WEEK[d.getDay()];
    document.getElementById('d-month').textContent = MONTH[d.getMonth()];
    document.getElementById('d-day').textContent = d.getDate();
    document.getElementById('d-period').textContent = prefs.h24 ? '' : (d.getHours() >= 12 ? 'PM' : 'AM');
  }

  function tick() {
    var now = new Date();
    var gap = lastTick ? now.getTime() - lastTick : 1e9;
    lastTick = now.getTime();
    var key = timeKey(now);

    if (key !== lastKey) {
      var first = lastKey === null;
      var animate = !first && gap < 1500;     // 休眠/切回前台后直接跳变，不做动画
      applyKey(key, animate);
      lastKey = key;
      updateDate(now);
      if (animate && prefs.sound && !document.hidden) Sound.click();
    }
    requestAnimationFrame(tick);
  }

  /* ===================== 自适应缩放 / 横屏（横放）===================== */
  function rotationActive() {
    if (prefs.landscape === 'on') return true;
    if (prefs.landscape === 'off') return false;
    // 自动：竖屏且为移动/平板尺寸时，整体旋转 90°，手机横放即可正读
    return window.innerHeight > window.innerWidth && Math.min(window.innerWidth, window.innerHeight) <= 820;
  }

  var fitRaf = 0;
  function fit() {
    if (fitRaf) return;
    fitRaf = requestAnimationFrame(function () {
      fitRaf = 0;
      var w = clock.offsetWidth;
      var h = clock.offsetHeight;
      if (!w || !h) return;
      var rotated = rotationActive();
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var availW = (rotated ? vh : vw) * 0.94;
      var availH = (rotated ? vw : vh) * 0.86;
      var k = Math.min(availW / w, availH / h, 2.2);
      // 四舍入到 2 位小数，避免亚像素缩放导致模糊
      clock.style.setProperty('--fit', Math.round(k * 100) / 100);
    });
  }

  function applyLayout() {
    var rotated = rotationActive();
    root.style.setProperty('--rot', rotated ? (prefs.flip < 0 ? '-90deg' : '90deg') : '0deg');
    document.body.classList.toggle('is-rotated', rotated);
    btnFlip.style.display = rotated ? '' : 'none';
    fit();
    setTimeout(fit, 120);      // 字体/换行稳定后复算一次
  }

  /* ===================== 界面同步 ===================== */
  function syncUI() {
    root.dataset.theme = prefs.theme;
    Array.prototype.forEach.call(document.querySelectorAll('.dot'), function (b) {
      b.classList.toggle('on', b.dataset.theme === prefs.theme);
    });
    btnSeconds.classList.toggle('on', prefs.seconds);
    btnHour.textContent = prefs.h24 ? '24H' : '12H';
    btnHour.classList.toggle('on', !prefs.h24);
    btnSound.classList.toggle('on', prefs.sound);
    btnDate.classList.toggle('on', prefs.date);
    btnLand.textContent = '横屏·' + ({ auto: '自动', on: '开', off: '关' })[prefs.landscape];
    btnLand.classList.toggle('on', prefs.landscape !== 'auto');
    document.body.classList.toggle('no-date', !prefs.date);
    document.body.classList.toggle('no-seconds', !prefs.seconds);
    metaTheme.setAttribute('content', THEME_COLOR[prefs.theme] || '#121212');
  }

  function refresh(animation) {
    var now = new Date();
    lastKey = timeKey(now);
    applyKey(lastKey, false);
    updateDate(now);
    syncUI();
    applyLayout();
    if (animation) fit();
  }

  /* ===================== 全屏 ===================== */
  function requestFullscreen() {
    var el = root;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (!fn) return;
    var ret = fn.call(el);
    Promise.resolve(ret).then(function () {
      // 移动端全屏后尝试锁定横屏；失败则由 CSS 旋转兜底
      try {
        if (screen.orientation && screen.orientation.lock && window.matchMedia('(pointer: coarse)').matches) {
          var p = screen.orientation.lock('landscape');
          if (p && p.catch) p.catch(function () {});
        }
      } catch (e) {}
    }).catch(function () {});
  }

  function exitFullscreen() {
    try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
    var fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (fn) Promise.resolve(fn.call(document)).catch(function () {});
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) requestFullscreen();
    else exitFullscreen();
  }

  /* ===================== 交互 ===================== */
  var idleTimer = null;
  function wake() {
    document.body.classList.add('ui-visible');
    document.body.classList.remove('idle');
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(function () {
      document.body.classList.remove('ui-visible');
      document.body.classList.add('idle');
    }, 3200);
  }

  function bindUI() {
    // 主题
    Array.prototype.forEach.call(document.querySelectorAll('.dot'), function (b) {
      b.addEventListener('click', function () {
        prefs.theme = b.dataset.theme;
        savePrefs(); syncUI();
      });
    });

    btnSeconds.addEventListener('click', function () {
      prefs.seconds = !prefs.seconds; savePrefs();
      lastKey = null; refresh();
    });

    btnHour.addEventListener('click', function () {
      prefs.h24 = !prefs.h24; savePrefs();
      // 上半数字需立即改写，重新渲染一次
      digits.h[0].value = null; digits.h[1].value = null;
      lastKey = null; refresh();
    });

    btnSound.addEventListener('click', function () {
      prefs.sound = !prefs.sound; savePrefs(); syncUI();
      if (prefs.sound) { Sound.unlock(); Sound.click(); }
    });

    btnDate.addEventListener('click', function () {
      prefs.date = !prefs.date; savePrefs(); syncUI(); fit();
    });

    btnLand.addEventListener('click', function () {
      prefs.landscape = prefs.landscape === 'auto' ? 'on' : (prefs.landscape === 'on' ? 'off' : 'auto');
      savePrefs(); syncUI(); applyLayout();
    });

    btnFlip.addEventListener('click', function () {
      prefs.flip = -prefs.flip; savePrefs(); applyLayout();
    });

    btnFull.addEventListener('click', toggleFullscreen);

    // 指针移动 / 触碰唤醒工具栏
    window.addEventListener('pointermove', wake, { passive: true });
    window.addEventListener('pointerdown', function () { Sound.unlock(); wake(); }, { passive: true });
    window.addEventListener('keydown', function (e) {
      Sound.unlock(); wake();
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    });

    // 双击空白处全屏
    document.addEventListener('dblclick', function (e) {
      if (e.target.closest && e.target.closest('.panel')) return;
      toggleFullscreen();
    });

    // 全屏状态变化后重算
    ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (ev) {
      document.addEventListener(ev, function () { setTimeout(applyLayout, 120); });
    });

    window.addEventListener('resize', applyLayout);
    window.addEventListener('orientationchange', function () { setTimeout(applyLayout, 250); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
    document.addEventListener('visibilitychange', function () { lastTick = 0; });
  }

  /* ===================== 启动 ===================== */
  function boot() {
    refresh();
    bindUI();
    wake();
    requestAnimationFrame(tick);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
